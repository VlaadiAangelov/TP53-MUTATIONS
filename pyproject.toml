[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tp53-mutations"
version = "0.1.0"
description = "Predict TP53 mutation status from cancer cell-line gene expression."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "joblib>=1.3",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

